<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Scratchpad Extension</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #131316;
      color: #e2e2e2;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d2d3a;
    }
    
    h1 {
      font-size: 14px;
      font-weight: bold;
      margin: 0;
      color: #a78bfa;
    }
    
    .status-indicator {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #3f3f46;
    }
    
    .status-connected {
      background-color: #166534;
      color: #bbf7d0;
    }
    
    .status-disconnected {
      background-color: #7f1d1d;
      color: #fecaca;
    }
    
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #6366f1;
    }
    
    button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }
    
    .ai-section {
      margin-bottom: 16px;
    }
    
    .ai-section h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #c084fc;
    }
    
    .ai-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .input-area {
      margin-top: 16px;
    }
    
    textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      background-color: #1f2937;
      color: #e2e2e2;
      border: 1px solid #374151;
      border-radius: 6px;
      resize: vertical;
      font-size: 12px;
    }
    
    .results {
      margin-top: 16px;
      padding: 12px;
      background-color: #1f2937;
      border-radius: 6px;
      border: 1px solid #374151;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .result-item {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #374151;
    }
    
    .result-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    
    .result-title {
      font-weight: bold;
      color: #a78bfa;
      margin-bottom: 4px;
    }
    
    .result-content {
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>Voice Scratchpad</h1>
      <div class="status-indicator" id="statusIndicator" data-status="disconnected">Disconnected</div>
    </div>
    
    <div class="controls">
      <button id="connectBtn">Connect</button>
      <button id="refreshBtn">Refresh</button>
    </div>
    
    <div class="ai-section">
      <h2>AI Intelligence</h2>
      <div class="ai-controls">
        <button id="generateProjectReportBtn">Generate Project Report</button>
        <button id="generateGlobalReportBtn">Generate Global Digest</button>
      </div>
      
      <div class="input-area">
        <textarea id="textInput" placeholder="Enter your note here..."></textarea>
        <button id="processBtn">Process with AI</button>
      </div>
    </div>
    
    <div class="results" id="results">
      <!-- Results will be displayed here -->
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
